name: Python syntax validation
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source (no model execution)
        run: python -m compileall -q "ML MODELS FLASK BASED APPS - EDUCATION"
